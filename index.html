    <style>
      .topic-path { position:relative; }
      .topic-path::before { position:absolute; top:42px; bottom:42px; left:50%; width:8px; border-radius:999px; background:#dbe9e4; content:""; transform:translateX(-50%); }
      .path-connector { display:none; }
      .lesson-orb { width:64px; height:64px; border:2px solid #cbded8; }
      .quiz-card { min-height:540px; }
      .quiz-body { position:relative; z-index:1; max-width:620px; margin-top:38px; }
      .answer-choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .choice-button { min-height:58px; padding:10px 14px; border:2px solid #cbdedf; border-radius:8px; background:#fff; color:var(--ink); font-weight:900; text-align:left; }
      .choice-button:hover:not(:disabled) { border-color:#9bdc8e; background:#fbfffa; }
      .choice-button.selected { border-color:var(--green); background:var(--green-pale); color:var(--green-dark); }
      .answer-input { display:block; }
      .answer-input input { min-height:58px; font-size:1.05rem; }
      .answer-feedback { margin-top:18px; padding:17px; border:2px solid; border-radius:8px; }
      .answer-feedback.correct { border-color:#a6da9b; background:#effbe9; color:#286a25; }
      .answer-feedback.incorrect { border-color:#f0c96a; background:#fff7dc; color:#805900; }
      .answer-feedback p { margin:7px 0 0; font-weight:800; }
      .answer-feedback .forms-grid { margin-top:14px; }
      .quiz-submit { margin-top:20px; }
      @media (max-width:640px) {
        .topic-path::before { left:34px; transform:none; }
        .answer-choices { grid-template-columns:1fr; }
        .quiz-card { min-height:560px; }
      }
      @media (max-width:640px) {
        .app-shell { grid-template-columns:1fr; }
        .side-rail { min-height:auto; padding:16px 18px; border-right:0; border-bottom:1px solid var(--line); }
        .primary-nav { display:flex; margin-top:17px; }
        .primary-nav button { min-height:40px; }
        .rail-status { display:none; }
        .workspace { width:100%; padding:24px 22px 42px; }
        .journey-view, .lesson-session, .dictionary-view { margin-top:36px; }
        .topbar { align-items:flex-start; }
        .topbar-stats { justify-content:flex-end; flex-wrap:wrap; }
        .dictionary-heading { display:grid; align-items:start; gap:18px; }
        h1 { font-size:1.65rem; }
        .journey-intro { grid-template-columns:minmax(0,1fr) 88px; gap:14px; }
        .journey-intro .goal-progress { grid-column:1 / -1; width:100%; }
        .journey-guide { width:88px; height:88px; }
        .topic-path { gap:14px; width:100%; margin-top:26px; }
        .lesson-step, .lesson-step:nth-child(odd), .lesson-step:nth-child(even) { justify-self:stretch; width:100%; }
        .topic-node { grid-template-columns:52px minmax(0,1fr); min-height:76px; }
        .lesson-orb { width:52px; height:52px; }
        .lesson-count { display:none; }
        .session-heading { grid-template-columns:1fr; gap:16px; }
        .session-heading .goal-progress { width:100%; }
        .challenge-card { min-height:510px; padding:30px 22px 28px; }
        .challenge-copy h2 { font-size:2.4rem; }
        .guide-image { top:22px; right:10px; width:42%; max-height:175px; opacity:.28; }
        .quiz-body { margin-top:36px; }
        .dictionary-search, .dictionary-grid { grid-template-columns:1fr; }
        .dictionary-search .primary-button { width:100%; }
        .word-detail { padding:23px; }
      }
    </style>

        `<span class="type-chip ${entry.type === "명사" ? "noun" : "verb"}">${entry.type}</span>`;
      const wordForms = (entry) =>
        entry.type === "명사"
          ? `<dl class="forms-grid noun-forms"><div><dt>성</dt><dd>${entry.article}</dd></div><div><dt>복수형</dt><dd>${entry.plural}</dd></div></dl>`
          : `<dl class="forms-grid"><div><dt>과거</dt><dd>${entry.past}</dd></div><div><dt>과거분사</dt><dd>${entry.participle}</dd></div><div><dt>접속법 2식</dt><dd>${entry.subjunctive2}</dd></div></dl>`;
      const findWords = () => {
        const query = normalize(state.query);
        return WORDS.filter(
          (entry) =>
            (state.mode === "전체" || state.mode === entry.type) &&
            (!query ||
              entry.ko.some((meaning) => meaning.includes(query)) ||
              entry.german.toLowerCase().includes(query)),
        );
      };
      const currentLesson = () =>
        LESSONS.find((lesson) => lesson.id === state.activeLesson) || null;
      const currentWords = () => {
        const lesson = currentLesson();
        return lesson
          ? lesson.words
              .map((german) => WORDS.find((entry) => entry.german === german))
              .filter(Boolean)
          : [];
      };
      const normalizeAnswer = (value) =>
        value.trim().toLowerCase().replace(/[.!?]/g, "").replace(/\s+/g, " ");
      const rotate = (items, amount) => {
        const offset = amount % items.length;
        return [...items.slice(offset), ...items.slice(0, offset)];
      };
      function currentExercises() {
        const lesson = currentLesson();
        const entries = currentWords();
        if (!lesson || !entries.length) return [];
        const sentence = LESSON_SENTENCES[lesson.id];
        const entryAt = (index) => entries[index % entries.length];
        const options = (entry, direction, index) => {
          const label = (item) =>
            direction === "de" ? title(item) : item.ko[0];
          return rotate(
            [entry, ...entries.filter((item) => item.german !== entry.german)]
              .slice(0, 4)
              .map(label),
            index,
          );
        };
        const koToDe = (index) => {
          const entry = entryAt(index);
          return {
            kind: "ko-de",
            prompt: entry.ko[0],
            expected: title(entry),
            choices: options(entry, "de", index),
            entry,
          };
        };
        const deToKo = (index) => {
          const entry = entryAt(index);
          return {
            kind: "de-ko",
            prompt: title(entry),
            expected: entry.ko[0],
            choices: options(entry, "ko", index),
            entry,
          };
        };
        return [
          koToDe(0),
          deToKo(1),
          koToDe(2),
          deToKo(3),
          { kind: "write-de", prompt: sentence.ko, expected: sentence.de },
          { kind: "translate-ko", prompt: sentence.de, expected: sentence.ko },
          koToDe(4),
          deToKo(5),
        ];
      }
      const nav = () =>
        `<aside class="side-rail"><button class="brand" data-home type="button" aria-label="학습 경로로 이동"><span class="brand-mark" aria-hidden="true">W</span><span>WORTWEG</span></button><nav class="primary-nav" aria-label="주요 메뉴"><button class="${state.view === "learn" ? "active" : ""}" data-view="learn" type="button"><span class="nav-dot" aria-hidden="true"></span>학습 경로</button><button class="${state.view === "dictionary" ? "active" : ""}" data-view="dictionary" type="button"><span class="nav-dot dictionary-dot" aria-hidden="true"></span>단어사전</button></nav><div class="rail-status"><p>오프라인 모드</p><strong>내장 단어 ${WORDS.length}개</strong><span>인터넷 연결 없이 레슨을 이어갈 수 있어요.</span></div></aside>`;
      const topbar = () =>
        `<header class="topbar"><div class="topbar-title"><span class="locale-chip">DE</span><p>독일어 단어 훈련</p></div><div class="topbar-stats" aria-label="학습 현황"><span>학습 단어 ${Math.min(state.learned.length, DAILY_GOAL)}/${DAILY_GOAL}</span><span class="offline-dot">오프라인</span></div></header>`;
      function journeyView() {
        const progress = (Math.min(state.learned.length, DAILY_GOAL) / DAILY_GOAL) * 100;
        const steps = LESSONS.map((lesson, index) => {
          const complete = state.completed.includes(lesson.id);
          const unlocked = index === 0 || state.completed.includes(LESSONS[index - 1].id);
          const status = complete ? "complete" : unlocked ? "current" : "locked";
          return `<div class="lesson-step ${status}"><button class="topic-node" data-lesson="${index}" ${unlocked ? "" : "disabled"} type="button"><span class="lesson-orb">${complete ? "완료" : index + 1}</span><span class="lesson-copy"><small>CHAPTER ${index + 1}</small><strong>${lesson.title}</strong><em>${lesson.subtitle}</em></span><span class="lesson-count">${lesson.words.length} 단어</span></button></div>`;
        }).join("");
        return `<section class="journey-view" aria-label="독일어 학습 경로"><div class="journey-intro"><div><p class="eyebrow">학습 경로</p><h1>챕터 길을 따라 배우세요.</h1><p>일상어부터 핵심 동사까지, 한 챕터씩 순서대로 완성합니다.</p></div><img class="journey-guide" src="./public/blue-dragon-guide.png" alt="단어 학습을 돕는 파란 용" /><div class="goal-progress" aria-label="오늘의 목표"><div class="progress-label"><span>오늘의 목표</span><strong>${Math.min(state.learned.length, DAILY_GOAL)}/${DAILY_GOAL}</strong></div><div class="progress-track"><span style="width:${progress}%"></span></div></div></div><div class="topic-path">${steps}</div></section>`;
      }
      function lessonView() {
        const lesson = currentLesson();
        const exercises = currentExercises();
        const exercise = exercises[state.lessonWordIndex] || exercises[0];
        const progress = ((state.lessonWordIndex + 1) / exercises.length) * 100;
        const instruction = exercise.kind === "write-de" ? "한국어 문장을 독일어로 직접 쓰세요." : exercise.kind === "translate-ko" ? "독일어 문장을 한국어로 옮기세요." : "가장 알맞은 답을 고르세요.";
        const choices = exercise.choices ? `<div class="answer-choices">${exercise.choices.map((choice) => `<button class="${state.selectedChoice === choice ? "choice-button selected" : "choice-button"}" data-choice="${choice}" ${state.checked ? "disabled" : ""} type="button">${choice}</button>`).join("")}</div>` : `<label class="answer-input"><span class="sr-only">답안</span><input id="typed-answer" ${state.checked ? "disabled" : ""} value="${state.typedAnswer}" placeholder="${exercise.kind === "write-de" ? "독일어로 입력" : "한국어로 입력"}" /></label>`;
        const feedback = state.checked ? `<div class="answer-feedback ${state.correct ? "correct" : "incorrect"}"><strong>${state.correct ? "정답이에요" : "다시 확인해보세요"}</strong><p>정답: ${exercise.expected}</p>${exercise.entry ? `${wordForms(exercise.entry)}<p class="word-note">${exercise.entry.note}</p>` : ""}</div>` : "";
        const action = state.checked ? `<button class="primary-button quiz-submit" id="next-exercise" type="button">다음</button>` : `<button class="primary-button quiz-submit" id="check-answer" ${exercise.choices ? (state.selectedChoice ? "" : "disabled") : (state.typedAnswer.trim() ? "" : "disabled")} type="button">확인</button>`;
        return `<section class="lesson-session" aria-label="${lesson.title} 레슨"><div class="session-heading"><button class="back-button" data-home type="button">학습 경로</button><div><p class="eyebrow">주제 레슨</p><h1>${lesson.title}</h1><p>${lesson.subtitle}</p></div><div class="goal-progress" aria-label="레슨 진행"><div class="progress-label"><span>레슨 진행</span><strong>${state.lessonWordIndex + 1}/${exercises.length}</strong></div><div class="progress-track"><span style="width:${progress}%"></span></div></div></div><section class="challenge-card quiz-card"><div class="challenge-copy"><p class="prompt-label">${EXERCISE_LABELS[exercise.kind]}</p><h2>${exercise.prompt}</h2><p class="alternate-meaning">${instruction}</p></div><img class="guide-image" src="./public/blue-dragon-guide.png" alt="단어 학습을 돕는 파란 용" /><div class="quiz-body">${choices}${feedback}${action}</div></section></section>`;
      }
      function dictionaryView() {
        const results = findWords();
        const selected =
          results.find((entry) => entry.german === state.selectedGerman) ||
          results[0] ||
          WORDS[0];
        const rows = results.length
          ? results
              .map(
                (entry) =>
                  `<button class="word-row ${selected.german === entry.german ? "selected" : ""}" data-word="${entry.german}" type="button">${typeChip(entry)}<span><strong>${title(entry)}</strong><small>${entry.ko.join(", ")}</small></span></button>`,
              )
              .join("")
          : `<p class="empty-state">아직 이 단어는 내장 사전에 없습니다.</p>`;
        return `<section class="dictionary-view" aria-label="독일어 단어사전"><div class="dictionary-heading"><div><p class="eyebrow">내장 사전</p><h1>단어를 찾아보세요</h1></div><span>${WORDS.length}개 단어</span></div><form class="dictionary-search" id="search-form"><label><span class="sr-only">검색어</span><input id="search-input" placeholder="한국어 뜻 또는 독일어 단어" /></label><button class="primary-button" type="submit">검색</button></form><div class="filter-row" aria-label="품사 필터"><button class="${state.mode === "전체" ? "active" : ""}" data-mode="전체" type="button">전체 <span>${WORDS.length}</span></button><button class="${state.mode === "명사" ? "active" : ""}" data-mode="명사" type="button">명사 <span>${nounCount}</span></button><button class="${state.mode === "동사" ? "active" : ""}" data-mode="동사" type="button">동사 <span>${verbCount}</span></button></div><div class="recent-row" id="recent-row" ${state.recent.length ? "" : "hidden"}><span>최근 검색</span></div><div class="dictionary-grid"><section class="result-list" aria-label="검색 결과"><div class="result-heading"><strong>검색 결과</strong><span>${results.length}개</span></div>${rows}</section><article class="word-detail" aria-label="선택한 단어의 형태">${typeChip(selected)}<h2>${title(selected)}</h2><p class="meaning">${selected.ko.join(", ")}</p>${wordForms(selected)}<p class="word-note">${selected.note}</p></article></div></section>`;
      }
      function saveQuery() {
        const clean = state.query.trim();
        if (!clean) return;
        state.recent = [
          clean,
          ...state.recent.filter((item) => item !== clean),
        ].slice(0, 6);
        localStorage.setItem(
          "deutsch-dictionary-recent",
          JSON.stringify(state.recent),
        );
      }
      function startLesson(index) {
        if (index > 0 && !state.completed.includes(LESSONS[index - 1].id))
          return;
        state.activeLesson = LESSONS[index].id;
        state.lessonWordIndex = 0;
        state.selectedChoice = "";
        state.typedAnswer = "";
        state.checked = false;
        state.correct = false;
        render();
      }
      function checkAnswer() {
        const exercise = currentExercises()[state.lessonWordIndex];
        if (!exercise) return;
        const answer = exercise.choices ? state.selectedChoice : state.typedAnswer;
        if (!answer) return;
        state.correct = normalizeAnswer(answer) === normalizeAnswer(exercise.expected);
        state.checked = true;
        render();
      }
      function nextExercise() {
        const lesson = currentLesson();
        const exercises = currentExercises();
        const exercise = exercises[state.lessonWordIndex];
        if (state.correct && exercise.entry && !state.learned.includes(exercise.entry.german)) {
          state.learned.push(exercise.entry.german);
          localStorage.setItem(
            "deutsch-learned-today",
            JSON.stringify(state.learned),
          );
        }
        const finalExercise = state.lessonWordIndex === exercises.length - 1;
        if (finalExercise) {
          if (!state.completed.includes(lesson.id)) {
            state.completed.push(lesson.id);
            localStorage.setItem(
              "deutsch-completed-lessons",
              JSON.stringify(state.completed),
            );
          }
          state.activeLesson = null;
          state.lessonWordIndex = 0;
        } else {
          state.lessonWordIndex += 1;
        }
        state.selectedChoice = "";
        state.typedAnswer = "";
        state.checked = false;
        state.correct = false;
        render();
      }
      function render() {
        app.innerHTML = `<main class="app-shell">${nav()}<section class="workspace">${topbar()}${state.view === "dictionary" ? dictionaryView() : state.activeLesson ? lessonView() : journeyView()}</section></main>`;
        app.querySelectorAll("[data-view]").forEach((button) =>
          button.addEventListener("click", () => {
            state.view = button.dataset.view;
            render();
          }),
        );
        app.querySelectorAll("[data-home]").forEach((button) =>
          button.addEventListener("click", () => {
            state.view = "learn";
            state.activeLesson = null;
            render();
          }),
        );
        if (state.view === "learn") {
          app
            .querySelectorAll("[data-lesson]")
            .forEach((button) =>
              button.addEventListener("click", () =>
                startLesson(Number(button.dataset.lesson)),
              ),
            );
          app.querySelectorAll("[data-choice]").forEach((button) =>
            button.addEventListener("click", () => {
              state.selectedChoice = button.dataset.choice;
              render();
            }),
          );
          const typedAnswer = document.getElementById("typed-answer");
          if (typedAnswer) typedAnswer.addEventListener("input", (event) => {
            state.typedAnswer = event.target.value;
            document.getElementById("check-answer").disabled = !state.typedAnswer.trim();
          });
          const check = document.getElementById("check-answer");
          const next = document.getElementById("next-exercise");
          if (check) check.addEventListener("click", checkAnswer);
          if (next) next.addEventListener("click", nextExercise);
          return;
        }
        const input = document.getElementById("search-input");
        input.value = state.query;
        input.addEventListener("input", (event) => {
          state.query = event.target.value;
        });
        document
          .getElementById("search-form")
          .addEventListener("submit", (event) => {
            event.preventDefault();
            saveQuery();
            render();
          });
        app.querySelectorAll("[data-mode]").forEach((button) =>
          button.addEventListener("click", () => {
            state.mode = button.dataset.mode;
            render();
          }),
        );
        app.querySelectorAll("[data-word]").forEach((button) =>
          button.addEventListener("click", () => {
            state.selectedGerman = button.dataset.word;
            render();
          }),
        );
        const recentRow = document.getElementById("recent-row");
        state.recent.forEach((query) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = query;
          button.addEventListener("click", () => {
            state.query = query;
            render();
          });
          recentRow.appendChild(button);
        });
      }
      fetch("./dictionary-data.json")
        .then((response) => {
          if (!response.ok) throw new Error();
          return response.json();
        })
        .then((data) => {
          WORDS = data;
          nounCount = WORDS.filter((word) => word.type === "명사").length;
          verbCount = WORDS.filter((word) => word.type === "동사").length;
          state.selectedGerman = WORDS[0].german;
          render();
        })
        .catch(() => {
          app.textContent = "단어 데이터를 불러오지 못했습니다.";
        });
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("./sw.js").catch(() => undefined);
    </script>
  </body>
</html>
