gn-items:end;justify-content:space-between;gap:30px;margin-bottom:26px}.dictionary-heading>span{color:var(--muted);font-size:.88rem;font-weight:800}.dictionary-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:20px}input{width:100%;min-height:50px;padding:0 15px;border:2px solid #cbdcdf;border-radius:8px;background:var(--surface);color:var(--ink);font-weight:700;outline:0}input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-pale)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.filter-row,.recent-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.filter-row{margin-bottom:14px}.filter-row button,.recent-row button{min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:.83rem;font-weight:800}.filter-row button:hover,.recent-row button:hover{border-color:#a5d69a;color:var(--green-dark)}.filter-row button.active{border-color:var(--green);background:var(--green-pale);color:var(--green-dark)}.recent-row{margin:0 0 26px}.recent-row>span{margin-right:4px;color:var(--muted);font-size:.8rem;font-weight:900}.dictionary-grid{display:grid;grid-template-columns:minmax(280px,.88fr) minmax(320px,1.12fr);gap:34px;align-items:start}.result-list{display:grid;gap:9px}.result-heading{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;color:var(--muted);font-size:.88rem}.result-heading strong{color:var(--ink)}.word-row{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-align:left}.word-row:hover{border-color:#a5d69a;background:#fbfffa}.word-row.selected{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}.word-row>span:last-child{display:grid;gap:4px;min-wi     <style>
      .topic-path { position:relative; }
      .topic-path::before { position:absolute; top:42px; bottom:42px; left:50%; width:8px; border-radius:999px; background:#dbe9e4; content:""; transform:translateX(-50%); }
      .path-connector { display:none; }
      .lesson-orb { width:64px; height:64px; border:2px solid #cbded8; }
      .quiz-card { min-height:540px; }
      .quiz-body { position:relative; z-index:1; max-width:620px; margin-top:38px; }
      .answer-choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .choice-button { min-height:58px; padding:10px 14px; border:2px solid #cbdedf; border-radius:8px; background:#fff; color:var(--ink); font-weight:900; text-align:left; }
      .choice-button:hover:not(:disabled) { border-color:#9bdc8e; background:#fbfffa; }
      .choice-button.selected { border-color:var(--green); background:var(--green-pale); color:var(--green-dark); }
      .answer-input { display:block; }
      .answer-input input { min-height:58px; font-size:1.05rem; }
      .answer-feedback { margin-top:18px; padding:17px; border:2px solid; border-radius:8px; }
      .answer-feedback.correct { border-color:#a6da9b; background:#effbe9; color:#286a25; }
      .answer-feedback.incorrect { border-color:#f0c96a; background:#fff7dc; color:#805900; }
      .answer-feedback p { margin:7px 0 0; font-weight:800; }
      .answer-feedback .forms-grid { margin-top:14px; }
      .quiz-submit { margin-top:20px; }
      @media (max-width:640px) {
        .topic-path::before { left:34px; transform:none; }
        .answer-choices { grid-template-columns:1fr; }
        .quiz-card { min-height:560px; }
      }
      @media (max-width:640px) {
        .app-shell { grid-template-columns:1fr; }
        .side-rail { min-height:auto; padding:16px 18px; border-right:0; border-bottom:1px solid var(--line); }
        .primary-nav { display:flex; margin-top:17px; }
        .primary-nav button { min-height:40px; }
        .rail-status { display:none; }
        .workspace { width:100%; padding:24px 22px 42px; }
        .journey-view, .lesson-session, .dictionary-view { margin-top:36px; }
        .topbar { align-items:flex-start; }
        .topbar-stats { justify-content:flex-end; flex-wrap:wrap; }
        .dictionary-heading { display:grid; align-items:start; gap:18px; }
        h1 { font-size:1.65rem; }
        .journey-intro { grid-template-columns:minmax(0,1fr) 88px; gap:14px; }
        .journey-intro .goal-progress { grid-column:1 / -1; width:100%; }
        .journey-guide { width:88px; height:88px; }
        .topic-path { gap:14px; width:100%; margin-top:26px; }
        .lesson-step, .lesson-step:nth-child(odd), .lesson-step:nth-child(even) { justify-self:stretch; width:100%; }
        .topic-node { grid-template-columns:52px minmax(0,1fr); min-height:76px; }
        .lesson-orb { width:52px; height:52px; }
        .lesson-count { display:none; }
        .session-heading { grid-template-columns:1fr; gap:16px; }
        .session-heading .goal-progress { width:100%; }
        .challenge-card { min-height:510px; padding:30px 22px 28px; }
        .challenge-copy h2 { font-size:2.4rem; }
        .guide-image { top:22px; right:10px; width:42%; max-height:175px; opacity:.28; }
        .quiz-body { margin-top:36px; }
        .dictionary-search, .dictionary-grid { grid-template-columns:1fr; }
        .dictionary-search .primary-button { width:100%; }
        .word-detail { padding:23px; }
      }
    </style>
    <style>
      .journey-intro { grid-template-columns:minmax(0,1fr) minmax(220px,.44fr); min-height:132px; }
      .topic-path { position:relative; display:grid; width:min(100%,680px); margin:34px auto 0; padding:14px 0; }
      .topic-path::before { position:absolute; top:54px; right:0; bottom:54px; left:0; width:8px; height:auto; margin:auto; border-radius:999px; background:#dbe9e4; content:""; transform:none; }
      .lesson-step { position:relative; z-index:1; display:grid; width:100%; height:132px; place-items:center; }
      .lesson-step:nth-child(odd) .topic-node { transform:translateX(-104px); }
      .lesson-step:nth-child(even) .topic-node { transform:translateX(104px); }
      .topic-node { display:grid; grid-template-rows:78px auto; gap:8px; justify-items:center; width:174px; min-height:0; padding:0; border:0; border-radius:0; background:transparent; color:var(--ink); text-align:center; transition:transform .16s ease; }
      .topic-node:hover:not(:disabled) { border:0; background:transparent; }
      .topic-node:hover:not(:disabled) .lesson-orb { border-color:#7ccc70; background:#67cf55; color:#fff; }
      .lesson-step.current .topic-node, .lesson-step.complete .topic-node { border:0; background:transparent; box-shadow:none; }
      .topic-node:disabled { opacity:.46; }
      .lesson-orb { width:78px; height:78px; border:2px solid #cbded8; border-bottom-width:6px; border-radius:50%; background:#dce9e5; color:var(--muted); font-size:.9rem; }
      .lesson-step.complete .lesson-orb { border-color:#8ccf82; border-bottom-color:#6dbe63; background:var(--green-pale); color:var(--green-dark); }
      .lesson-copy { gap:3px; }
      .lesson-count, .journey-guide, .guide-image { display:none; }
      @media (max-width:640px) {
        .journey-intro { grid-template-columns:1fr; gap:18px; }
        .topic-path { margin-top:26px; }
        .topic-path::before { top:48px; bottom:48px; left:0; transform:none; }
        .lesson-step { height:122px; }
        .lesson-step:nth-child(odd) .topic-node { transform:translateX(-56px); }
        .lesson-step:nth-child(even) .topic-node { transform:translateX(56px); }
        .topic-node { grid-template-rows:66px auto; width:150px; }
        .lesson-orb { width:66px; height:66px; font-size:.82rem; }
      }
    </style>
    <style>

      .dictionary-filters button span { margin-left:3px; color:inherit; font-size:.72rem; }
      .recent-row.dictionary-recent { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:15px 0 17px; }
      .dictionary-recent > span { margin-right:3px; color:var(--muted); font-size:.78rem; font-weight:900; }
      .dictionary-recent button { min-height:30px; padding:0 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--muted); font-size:.78rem; font-weight:800; }
      .dictionary-recent button:hover { border-color:#a5d69a; color:var(--green-dark); }
      .dictionary-workbench { display:grid; grid-template-columns:minmax(280px,.82fr) minmax(0,1.18fr); min-height:520px; overflow:hidden; border:1px solid #cbded7; border-radius:8px; background:var(--surface); box-shadow:0 2px 0 #dce9e3; }
      .dictionary-results { min-width:0; border-right:1px solid #d7e4df; background:#fbfdfc; }
      .result-heading { display:flex; align-items:center; justify-content:space-between; min-height:58px; padding:0 20px; border-bottom:1px solid #d7e4df; color:var(--muted); font-size:.84rem; }
      .result-heading strong { color:var(--ink); }
      .word-list { max-height:610px; overflow-y:auto; }
      .word-row { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:12px; width:100%; min-height:68px; padding:11px 20px; border:0; border-bottom:1px solid #e1ebe7; border-radius:0; background:transparent; color:var(--ink); text-align:left; }
      .word-row:hover { border-color:#e1ebe7; background:#f3faf4; }
      .word-row.selected { border-color:#e1ebe7; background:#ecf9e9; box-shadow:inset 4px 0 0 var(--green); }
      .word-row-main { display:grid; gap:4px; min-width:0; }
      .word-row small { color:var(--muted); font-size:.78rem; font-weight:700; overflow-wrap:anywhere; }
      .word-sheet { min-width:0; padding:36px 38px; background:var(--surface); }
      .word-sheet-title { display:flex; align-items:center; gap:9px; }
      .word-sheet-title p, .inflection-label { margin:0; color:var(--muted); font-size:.78rem; font-weight:900; }
      .word-sheet h2 { margin:23px 0 7px; font-size:clamp(2.2rem,4vw,3.05rem); line-height:1; overflow-wrap:anywhere; }
      .word-sheet .meaning { margin-bottom:0; }
      .sheet-divider { height:1px; margin:28px 0 22px; background:var(--line); }
      .inflection-panel { display:grid; gap:12px; }
      .word-sheet .forms-grid { margin:0; }
      .word-sheet .word-note { display:grid; gap:6px; margin:25px 0 0; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:.88rem; line-height:1.55; }
      .word-sheet .word-note span { color:var(--ink); font-size:.73rem; font-weight:900; }
      .empty-state { margin:0; padding:24px 20px; }
      @media (max-width:640px) {
        .dictionary-heading { display:grid; align-items:start; gap:18px; }
        .dictionary-heading h1 { font-size:1.85rem; }
        .dictionary-toolbar, .dictionary-search, .dictionary-workbench { grid-template-columns:1fr; }
        .dictionary-toolbar { align-items:stretch; }
        .dictionary-filters { width:100%; }
        .dictionary-filters button { flex:1; }
        .dictionary-search .primary-button { width:100%; }
        .dictionary-workbench { min-height:0; }
        .dictionary-results { border-right:0; border-bottom:1px solid #d7e4df; }
        .word-list { max-height:310px; }
        .word-sheet { padding:27px 22px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const DAILY_GOAL = 8;
      const LESSONS = [
        { id: "greeting", title: "첫 인사", subtitle: "이름을 말하고 사람을 소개해요", words: ["Mensch", "Frau", "Mann", "Name", "heißen", "sein", "sprechen"] },
        { id: "family", title: "가족", subtitle: "가까운 사람을 소개해요", words: ["Familie", "Mutter", "Vater", "Bruder", "Schwester", "Kind", "haben", "lieben"] },
        { id: "time", title: "시간과 하루", subtitle: "하루와 약속을 말해요", words: ["Morgen", "Abend", "Tag", "Nacht", "Woche", "Monat", "Uhr", "beginnen"] },
        { id: "school", title: "학교", subtitle: "배우고 읽고 써요", words: ["Schule", "Buch", "Lehrer", "Sprache", "Satz", "Prüfung", "lesen", "schreiben", "lernen", "verstehen"] },
        { id: "home", title: "집과 방", subtitle: "사물과 위치를 말해요", words: ["Haus", "Zimmer", "Tisch", "Fenster", "Tür", "wohnen", "öffnen", "schließen", "sitzen", "liegen"] },
        { id: "routine", title: "일상 동작", subtitle: "매일 하는 일을 말해요", words: ["Zeit", "Arbeit", "Weg", "gehen", "kommen", "machen", "arbeiten", "schlafen", "spielen", "hören"] },
        { id: "food-basics", title: "음식 기초", subtitle: "먹고 마시는 것을 말해요", words: ["Wasser", "Brot", "Apfel", "Essen", "essen", "trinken", "brauchen"] },
        { id: "cafe", title: "카페와 식당", subtitle: "주문하고 계산해요", words: ["Kaffee", "Tee", "Restaurant", "Essen", "bestellen", "bezahlen", "kochen", "warten"] },
        { id: "market", title: "시장", subtitle: "사고 고르고 찾아요", words: ["Markt", "Supermarkt", "Geld", "Preis", "Karte", "kaufen", "verkaufen", "wählen", "suchen"] },
        { id: "clothes", title: "옷과 취향", subtitle: "물건의 취향을 말해요", words: ["Kleidung", "Hemd", "Jacke", "Schuh", "Bild", "mögen", "lieben", "brauchen"] },
        { id: "weather", title: "날씨", subtitle: "오늘의 날씨를 묘사해요", words: ["Wetter", "Sonne", "Regen", "Tag", "Nacht", "hoffen", "sehen"] },
        { id: "nature", title: "자연", subtitle: "풍경과 이동을 말해요", words: ["Meer", "Berg", "Wald", "Park", "Weg", "laufen", "reisen", "sehen"] },
        { id: "city", title: "도시", subtitle: "도시의 장소를 찾아요", words: ["Stadt", "Platz", "Straße", "Brücke", "Park", "Auto", "gehen", "finden", "zeigen"] },
        { id: "transport", title: "교통", subtitle: "기차와 이동을 익혀요", words: ["Bahnhof", "Zug", "Auto", "Weg", "fahren", "warten", "aussteigen", "einsteigen"] },
        { id: "travel", title: "여행", subtitle: "호텔부터 공항까지", words: ["Hotel", "Flughafen", "Land", "Karte", "reisen", "fliegen", "ankommen", "besuchen"] },
        { id: "conversation", title: "대화", subtitle: "질문하고 답해요", words: ["Frage", "Antwort", "Sprache", "Nachricht", "Lehrer", "sprechen", "fragen", "antworten", "erklären"] },
        { id: "digital", title: "디지털 생활", subtitle: "메시지와 정보를 다뤄요", words: ["Computer", "Handy", "Nachricht", "Bild", "schreiben", "zeigen", "finden", "erhalten"] },
        { id: "free-time", title: "여가", subtitle: "취미와 약속을 말해요", words: ["Hobby", "Film", "Freund", "Wochenende", "spielen", "hören", "mögen", "treffen"] },
        { id: "work", title: "공부와 일", subtitle: "목표와 의무를 말해요", words: ["Beruf", "Arbeit", "Prüfung", "Computer", "studieren", "arbeiten", "lernen", "wollen", "müssen"] },
        { id: "people", title: "사람", subtitle: "사람의 관계를 묘사해요", words: ["Junge", "Mädchen", "Mensch", "Freund", "Kopf", "Herz", "treffen", "kennen", "helfen"] },
        { id: "core-a", title: "핵심 동사 I", subtitle: "문장의 뼈대를 만들어요", words: ["sein", "haben", "werden", "können", "müssen", "wollen", "sollen"] },
        { id: "core-b", title: "핵심 동사 II", subtitle: "변화와 결과를 말해요", words: ["geben", "nehmen", "bringen", "finden", "bleiben", "verlieren", "gewinnen"] },
        { id: "core-c", title: "핵심 동사 III", subtitle: "생각과 기억을 표현해요", words: ["wissen", "denken", "glauben", "hoffen", "vergessen", "erhalten", "verstehen"] },
        { id: "review", title: "종합 복습", subtitle: "배운 단어를 연결해요", words: ["Buch", "Freund", "Wasser", "Stadt", "Hotel", "Frage", "gehen", "essen", "reisen", "sprechen", "können"] },
      ];
      const LESSON_SENTENCES = {
        greeting: { ko: "나는 안나이다.", de: "Ich heiße Anna." },
        family: { ko: "나는 가족이 있다.", de: "Ich habe eine Familie." },
        time: { ko: "오늘은 좋은 날이다.", de: "Heute ist ein guter Tag." },
        school: { ko: "나는 독일어를 배운다.", de: "Ich lerne Deutsch." },
        home: { ko: "나는 창문을 연다.", de: "Ich öffne das Fenster." },
        routine: { ko: "나는 집에 간다.", de: "Ich gehe nach Hause." },
        "food-basics": { ko: "나는 빵을 먹는다.", de: "Ich esse Brot." },
        cafe: { ko: "우리는 차를 주문한다.", de: "Wir bestellen Tee." },
        market: { ko: "나는 카드로 지불한다.", de: "Ich bezahle mit Karte." },
        clothes: { ko: "나는 재킷을 좋아한다.", de: "Ich mag die Jacke." },
        weather: { ko: "오늘 날씨가 좋다.", de: "Das Wetter ist heute gut." },
        nature: { ko: "우리는 바다를 본다.", de: "Wir sehen das Meer." },
        city: { ko: "공원이 도시에 있다.", de: "Der Park ist in der Stadt." },
        transport: { ko: "기차가 역에 온다.", de: "Der Zug kommt zum Bahnhof." },
        travel: { ko: "나는 비행기로 여행한다.", de: "Ich reise mit dem Flugzeug." },
        conversation: { ko: "선생님이 질문에 답한다.", de: "Der Lehrer antwortet auf die Frage." },
        digital: { ko: "나는 메시지를 쓴다.", de: "Ich schreibe eine Nachricht." },
        "free-time": { ko: "나는 영화를 좋아한다.", de: "Ich mag den Film." },
        work: { ko: "나는 독일어를 공부한다.", de: "Ich studiere Deutsch." },
        people: { ko: "나는 친구를 만난다.", de: "Ich treffe einen Freund." },
        "core-a": { ko: "나는 독일어를 배울 수 있다.", de: "Ich kann Deutsch lernen." },
        "core-b": { ko: "나는 책을 가져온다.", de: "Ich bringe das Buch." },
        "core-c": { ko: "나는 답을 안다.", de: "Ich weiß die Antwort." },
        review: { ko: "나는 독일어를 안다.", de: "Ich kenne Deutsch." },
      };
      const EXERCISE_LABELS = {
        "ko-de": "한국어 > 독일어",
        "de-ko": "독일어 > 한국어",
        "type-de": "독일어 단어 입력",
        article: "독일어 성 고르기",
        plural: "복수형 고르기",
        past: "과거형 고르기",
        participle: "과거분사 고르기",
        "write-de": "독일어 작문",
        "translate-ko": "한국어 번역",
      };
      const app = document.getElementById("app");
      const readList = (key) => {
        try {
          const value = JSON.parse(localStorage.getItem(key) || "[]");
          return Array.isArray(value) ? value : [];
        } catch {
          return [];
        }
      };
      let WORDS = [];
      let nounCount = 0;
      let verbCount = 0;
      const state = {
        view: "learn",
        activeLesson: null,
        lessonWordIndex: 0,
        selectedChoice: "",
        typedAnswer: "",
        checked: false,
        correct: false,
        learned: readList("deutsch-learned-today"),
        completed: readList("deutsch-completed-lessons"),
        mode: "전체",
        query: "",
        recent: readList("deutsch-dictionary-recent"),
        selectedGerman: "",
      };
      const normalize = (value) =>
        value.trim().toLowerCase().replace(/\s+/g, " ");
      const title = (entry) =>
        entry.type === "명사"
          ? `${entry.article} ${entry.german}`
          : entry.german;
      const typeChip = (entry) =>
        `<span class="type-chip ${entry.type === "명사" ? "noun" : "verb"}">${entry.type}</span>`;
      const wordForms = (entry) =>
        entry.type === "명사"
          ? `<dl class="forms-grid noun-forms"><div><dt>성</dt><dd>${entry.article}</dd></div><div><dt>복수형</dt><dd>${entry.plural}</dd></div></dl>`
          : `<dl class="forms-grid"><div><dt>과거</dt><dd>${entry.past}</dd></div><div><dt>과거분사</dt><dd>${entry.participle}</dd></div><div><dt>접속법 2식</dt><dd>${entry.subjunctive2}</dd></div></dl>`;
      const findWords = () => {
        const query = normalize(state.query);
        return WORDS.filter(
          (entry) =>
            (state.mode === "전체" || state.mode === entry.type) &&
            (!query ||
              entry.ko.some((meaning) => meaning.includes(query)) ||
              entry.german.toLowerCase().includes(query)),
        );
      };
      const currentLesson = () =>
        LESSONS.find((lesson) => lesson.id === state.activeLesson) || null;
      const currentWords = () => {
        const lesson = currentLesson();
        return lesson
          ? lesson.words
              .map((german) => WORDS.find((entry) => entry.german === german))
              .filter(Boolean)
          : [];
      };
      const normalizeAnswer = (value) =>
        value.trim().toLowerCase().replace(/[.!?]/g, "").replace(/\s+/g, " ");
      const rotate = (items, amount) => {
        const offset = amount % items.length;
        return [...items.slice(offset), ...items.slice(0, offset)];
      };
      const choiceSet = (correct, distractors, index) =>
        rotate([...new Set([correct, ...distractors])].slice(0, 4), index);
      const exerciseHint = (kind) => {
        if (kind === "write-de") return "한국어 문장을 독일어로 직접 쓰세요.";
        if (kind === "translate-ko") return "독일어 문장을 한국어로 옮기세요.";
        if (kind === "type-de") return "관사까지 포함해 독일어 단어를 직접 입력하세요.";
        if (kind === "article") return "성에 맞는 관사를 고르세요.";
        if (kind === "plural") return "알맞은 복수형을 고르세요.";
        if (kind === "past" || kind === "participle") return "동사 변화형을 고르세요.";
        return "가장 알맞은 답을 고르세요.";
      };
      const answerPlaceholder = (kind) =>
        kind === "translate-ko" ? "한국어로 입력" : "독일어로 입력";
      function currentExercises() {
        const lesson = currentLesson();
        const entries = currentWords();
        if (!lesson || !entries.length) return [];
        const sentence = LESSON_SENTENCES[lesson.id];
        const nouns = entries.filter((entry) => entry.type === "명사");
        const verbs = entries.filter((entry) => entry.type === "동사");
        const entryAt = (index) => entries[index % entries.length];
        const options = (entry, direction, index) => {
          const label = (item) =>
            direction === "de" ? title(item) : item.ko[0];
          return choiceSet(
            label(entry),
            entries.filter((item) => item.german !== entry.german).map(label),
            index,
          );
        };
        const koToDe = (index) => {
          const entry = entryAt(index);
          return {
            kind: "ko-de",
            prompt: entry.ko[0],
            expected: title(entry),
            choices: options(entry, "de", index),
            entry,
          };
        };
        const deToKo = (index) => {
          const entry = entryAt(index);
          return {
            kind: "de-ko",
            prompt: title(entry),
            expected: entry.ko[0],
            choices: options(entry, "ko", index),
            entry,
          };
        };
        const typeGerman = (index) => {
          const entry = entryAt(index);
          return { kind: "type-de", prompt: entry.ko[0], expected: title(entry), entry };
        };
        const articleQuestion = (entry, index) => {
          const expected = `${entry.article} ${entry.german}`;
          const alternatives = ["der", "die", "das"].map((article) => `${article} ${entry.german}`);
          return { kind: "article", prompt: `${entry.german}의 알맞은 성을 고르세요.`, expected, choices: choiceSet(expected, alternatives, index), entry };
        };
        const pluralQuestion = (entry, index) => {
          const alternatives = [entry.german, ...nouns.filter((noun) => noun.german !== entry.german).map((noun) => noun.plural)];
          return { kind: "plural", prompt: `${entry.german}의 복수형을 고르세요.`, expected: entry.plural, choices: choiceSet(entry.plural, alternatives, index), entry };
        };
        const verbFormQuestion = (entry, kind, index) => {
          const expected = kind === "past" ? entry.past : entry.participle;
          const alternatives = [entry.german, ...verbs.filter((verb) => verb.german !== entry.german).map((verb) => kind === "past" ? verb.past : verb.participle)];
          const label = kind === "past" ? "과거형" : "과거분사";
          const particle = kind === "past" ? "을" : "를";
          return { kind, prompt: `${entry.german}의 ${label}${particle} 고르세요.`, expected, choices: choiceSet(expected, alternatives, index), entry };
        };
        const nounForArticle = nouns[Math.min(2, nouns.length - 1)];
        const nounForPlural = nouns[0];
        const verbForForms = verbs[0];
        return [
          koToDe(0),
          deToKo(1),
          typeGerman(2),
          ...(nounForArticle ? [articleQuestion(nounForArticle, 3), pluralQuestion(nounForPlural, 4)] : []),
          ...(verbForForms ? [verbFormQuestion(verbForForms, "past", 5), verbFormQuestion(verbForForms, "participle", 6)] : []),
          { kind: "write-de", prompt: sentence.ko, expected: sentence.de },
          { kind: "translate-ko", prompt: sentence.de, expected: sentence.ko },
          koToDe(4),
        ];
      }
      const nav = () =>
        `<aside class="side-rail"><button class="brand" data-home type="button" aria-label="학습 경로로 이동"><span class="brand-mark" aria-hidden="true">W</span><span>WORTWEG</span></button><nav class="primary-nav" aria-label="주요 메뉴"><button class="${state.view === "learn" ? "active" : ""}" data-view="learn" type="button"><span class="nav-dot" aria-hidden="true"></span>학습 경로</button><button class="${state.view === "dictionary" ? "active" : ""}" data-view="dictionary" type="button"><span class="nav-dot dictionary-dot" aria-hidden="true"></span>단어사전</button></nav><div class="rail-status"><p>오프라인 모드</p><strong>내장 단어 ${WORDS.length}개</strong><span>인터넷 연결 없이 레슨을 이어갈 수 있어요.</span></div></aside>`;
      const topbar = () =>
        `<header class="topbar"><div class="topbar-title"><span class="locale-chip">DE</span><p>독일어 단어 훈련</p></div><div class="topbar-stats" aria-label="학습 현황"><span>챕터 ${state.completed.length}/${LESSONS.length}</span><span class="offline-dot">오프라인</span></div></header>`;
      function journeyView() {
        const progress = (Math.min(state.learned.length, DAILY_GOAL) / DAILY_GOAL) * 100;
        const steps = LESSONS.map((lesson, index) => {
          const complete = state.completed.includes(lesson.id);
          const unlocked = index === 0 || state.completed.includes(LESSONS[index - 1].id);
          const status = complete ? "complete" : unlocked ? "current" : "locked";
          return `<div class="lesson-step ${status}"><button class="topic-node" data-lesson="${index}" ${unlocked ? "" : "disabled"} type="button"><span class="lesson-orb">${complete ? "완료" : index + 1}</span><span class="lesson-copy"><small>CHAPTER ${String(index + 1).padStart(2, "0")}</small><strong>${lesson.title}</strong><em>${lesson.subtitle}</em></span></button></div>`;
        }).join("");
        return `<section class="journey-view" aria-label="독일어 학습 경로"><div class="journey-intro"><div><p class="eyebrow">독일어 기초 코스</p><h1>길을 따라, 문장까지.</h1><p>24개 챕터에서 새 단어, 관사, 변화형, 번역을 순서대로 연결합니다.</p></div><div class="goal-progress" aria-label="오늘의 목표"><div class="progress-label"><span>오늘의 목표</span><strong>${Math.min(state.learned.length, DAILY_GOAL)}/${DAILY_GOAL}</strong></div><div class="progress-track"><span style="width:${progress}%"></span></div></div></div><div class="topic-path">${steps}</div></section>`;
      }
      function lessonView() {
        const lesson = currentLesson();
        const exercises = currentExercises();
        const exercise = exercises[state.lessonWordIndex] || exercises[0];
        const progress = ((state.lessonWordIndex + 1) / exercises.length) * 100;
        const instruction = exerciseHint(exercise.kind);
        const choices = exercise.choices ? `<div class="answer-choices">${exercise.choices.map((choice) => `<button class="${state.selectedChoice === choice ? "choice-button selected" : "choice-button"}" data-choice="${choice}" ${state.checked ? "disabled" : ""} type="button">${choice}</button>`).join("")}</div>` : `<label class="answer-input"><span class="sr-only">답안</span><input id="typed-answer" ${state.checked ? "disabled" : ""} value="${state.typedAnswer}" placeholder="${answerPlaceholder(exercise.kind)}" /></label>`;
        const feedback = state.checked ? `<div class="answer-feedback ${state.correct ? "correct" : "incorrect"}"><strong>${state.correct ? "정답이에요" : "다시 확인해보세요"}</strong><p>정답: ${exercise.expected}</p>${exercise.entry ? `${wordForms(exercise.entry)}<p class="word-note">${exercise.entry.note}</p>` : ""}</div>` : "";
        const action = state.checked ? `<button class="primary-button quiz-submit" id="${state.correct ? "next-exercise" : "retry-exercise"}" type="button">${state.correct ? "다음" : "다시 풀기"}</button>` : `<button class="primary-button quiz-submit" id="check-answer" ${exercise.choices ? (state.selectedChoice ? "" : "disabled") : (state.typedAnswer.trim() ? "" : "disabled")} type="button">확인</button>`;
        return `<section class="lesson-session" aria-label="${lesson.title} 레슨"><div class="session-heading"><button class="back-button" data-home type="button">학습 경로</button><div><p class="eyebrow">주제 레슨</p><h1>${lesson.title}</h1><p>${lesson.subtitle}</p></div><div class="goal-progress" aria-label="레슨 진행"><div class="progress-label"><span>레슨 진행</span><strong>${state.lessonWordIndex + 1}/${exercises.length}</strong></div><div class="progress-track"><span style="width:${progress}%"></span></div></div></div><section class="challenge-card quiz-card"><div class="challenge-copy"><p class="prompt-label">${EXERCISE_LABELS[exercise.kind]}</p><h2>${exercise.prompt}</h2><p class="alternate-meaning">${instruction}</p></div><div class="quiz-body">${choices}${feedback}${action}</div></section></section>`;
      }
      function dictionaryView() {
        const results = findWords();
        const selected =
          results.find((entry) => entry.german === state.selectedGerman) ||
          results[0] ||
          WORDS[0];
        const rows = results.length
          ? results
              .map(
                (entry) =>
                  `<button class="word-row ${selected.german === entry.german ? "selected" : ""}" data-word="${entry.german}" type="button">${typeChip(entry)}<span class="word-row-main"><strong>${title(entry)}</strong><small>${entry.ko.join(", ")}</small></span></button>`,
              )
              .join("")
          : `<p class="empty-state">아직 이 단어는 내장 사전에 없습니다.</p>`;
        const wordType = selected.type === "명사" ? "명사 / 성과 복수형" : "동사 / 주요 변화형";
        return `<section class="dictionary-view" aria-label="독일어 단어사전"><div class="dictionary-heading"><div><p class="eyebrow">OFFLINE LEXICON</p><h1>독일어 단어사전</h1><p class="dictionary-subtitle">뜻으로 찾고, 꼭 필요한 형태를 바로 확인하세요.</p></div><span class="dictionary-total">내장 ${WORDS.length}개</span></div><div class="dictionary-toolbar"><form class="dictionary-search" id="search-form" role="search"><label><span class="sr-only">검색어</span><input id="search-input" placeholder="한국어 뜻 또는 독일어 단어" /></label><button class="primary-button" type="submit">검색</button></form><div class="dictionary-filters" aria-label="품사 필터"><button class="${state.mode === "전체" ? "active" : ""}" data-mode="전체" type="button">전체 <span>${WORDS.length}</span></button><button class="${state.mode === "명사" ? "active" : ""}" data-mode="명사" type="button">명사 <span>${nounCount}</span></button><button class="${state.mode === "동사" ? "active" : ""}" data-mode="동사" type="button">동사 <span>${verbCount}</span></button></div></div><div class="recent-row dictionary-recent" id="recent-row" ${state.recent.length ? "" : "hidden"}><span>최근 검색</span></div><div class="dictionary-workbench"><section class="dictionary-results" aria-label="검색 결과"><div class="result-heading"><strong>검색 결과</strong><span>${results.length}개</span></div>${results.length ? `<div class="word-list">${rows}</div>` : rows}</section><article class="word-sheet" aria-label="선택한 단어의 형태"><div class="word-sheet-title">${typeChip(selected)}<p>${wordType}</p></div><h2>${title(selected)}</h2><p class="meaning">${selected.ko.join(", ")}</p><div class="sheet-divider"></div><section class="inflection-panel" aria-label="단어 변화형"><p class="inflection-label">형태</p>${wordForms(selected)}</section><p class="word-note"><span>학습 메모</span>${selected.note}</p></article></div></section>`;
      }
      function saveQuery() {
        const clean = state.query.trim();
        if (!clean) return;
        state.recent = [
          clean,
          ...state.recent.filter((item) => item !== clean),
        ].slice(0, 6);
        localStorage.setItem(
          "deutsch-dictionary-recent",
          JSON.stringify(state.recent),
        );
      }
      function startLesson(index) {
        if (index > 0 && !state.completed.includes(LESSONS[index - 1].id))
          return;
        state.activeLesson = LESSONS[index].id;
        state.lessonWordIndex = 0;
        state.selectedChoice = "";
        state.typedAnswer = "";
        state.checked = false;
        state.correct = false;
        render();
      }
      function checkAnswer() {
        const exercise = currentExercises()[state.lessonWordIndex];
        if (!exercise) return;
        const answer = exercise.choices ? state.selectedChoice : state.typedAnswer;
        if (!answer) return;
        state.correct = normalizeAnswer(answer) === normalizeAnswer(exercise.expected);
        state.checked = true;
        render();
      }
      function nextExercise() {
        const lesson = currentLesson();
        const exercises = currentExercises();
        const exercise = exercises[state.lessonWordIndex];
        if (state.correct && exercise.entry && !state.learned.includes(exercise.entry.german)) {
          state.learned.push(exercise.entry.german);
          localStorage.setItem(
            "deutsch-learned-today",
            JSON.stringify(state.learned),
          );
        }
        const finalExercise = state.lessonWordIndex === exercises.length - 1;
        if (finalExercise) {
          if (!state.completed.includes(lesson.id)) {
            state.completed.push(lesson.id);
            localStorage.setItem(
              "deutsch-completed-lessons",
              JSON.stringify(state.completed),
            );
          }
          state.activeLesson = null;
          state.lessonWordIndex = 0;
        } else {
          state.lessonWordIndex += 1;
        }
        state.selectedChoice = "";
        state.typedAnswer = "";
        state.checked = false;
        state.correct = false;
        render();
      }
      function retryExercise() {
        state.selectedChoice = "";
        state.typedAnswer = "";
        state.checked = false;
        state.correct = false;
        render();
      }
      function render() {
        app.innerHTML = `<main class="app-shell">${nav()}<section class="workspace">${topbar()}${state.view === "dictionary" ? dictionaryView() : state.activeLesson ? lessonView() : journeyView()}</section></main>`;
        app.querySelectorAll("[data-view]").forEach((button) =>
          button.addEventListener("click", () => {
            state.view = button.dataset.view;
            render();
          }),
        );
        app.querySelectorAll("[data-home]").forEach((button) =>
          button.addEventListener("click", () => {
            state.view = "learn";
            state.activeLesson = null;
            render();
          }),
        );
        if (state.view === "learn") {
          app
            .querySelectorAll("[data-lesson]")
            .forEach((button) =>
              button.addEventListener("click", () =>
                startLesson(Number(button.dataset.lesson)),
              ),
            );
          app.querySelectorAll("[data-choice]").forEach((button) =>
            button.addEventListener("click", () => {
              state.selectedChoice = button.dataset.choice;
              render();
            }),
          );
          const typedAnswer = document.getElementById("typed-answer");
          if (typedAnswer) typedAnswer.addEventListener("input", (event) => {
            state.typedAnswer = event.target.value;
            document.getElementById("check-answer").disabled = !state.typedAnswer.trim();
          });
          const check = document.getElementById("check-answer");
          const next = document.getElementById("next-exercise");
          const retry = document.getElementById("retry-exercise");
          if (check) check.addEventListener("click", checkAnswer);
          if (next) next.addEventListener("click", nextExercise);
          if (retry) retry.addEventListener("click", retryExercise);
          return;
        }
        const input = document.getElementById("search-input");
        input.value = state.query;
        input.addEventListener("input", (event) => {
          state.query = event.target.value;
        });
        document
          .getElementById("search-form")
          .addEventListener("submit", (event) => {
            event.preventDefault();
            saveQuery();
            render();
          });
        app.querySelectorAll("[data-mode]").forEach((button) =>
          button.addEventListener("click", () => {
            state.mode = button.dataset.mode;
            render();
          }),
        );
        app.querySelectorAll("[data-word]").forEach((button) =>
          button.addEventListener("click", () => {
            state.selectedGerman = button.dataset.word;
            render();
          }),
        );
        const recentRow = document.getElementById("recent-row");
        state.recent.forEach((query) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = query;
          button.addEventListener("click", () => {
            state.query = query;
            render();
          });
          recentRow.appendChild(button);
        });
      }
      fetch("./dictionary-data.json")
        .then((response) => {
          if (!response.ok) throw new Error();
          return response.json();
        })
        .then((data) => {
          WORDS = data;
          nounCount = WORDS.filter((word) => word.type === "명사").length;
          verbCount = WORDS.filter((word) => word.type === "동사").length;
          state.selectedGerman = WORDS[0].german;
          render();
        })
        .catch(() => {
          app.textContent = "단어 데이터를 불러오지 못했습니다.";
        });
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("./sw.js").catch(() => undefined);
    </script>
  </body>
</html>
