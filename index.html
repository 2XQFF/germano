<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 독일어 단어사전</title>
    <meta
      name="description"
      content="한국어 뜻으로 독일어 명사의 성과 복수형, 동사의 주요 변화를 확인하는 오프라인 단어사전."
    />
    <style>
      :root {
        --background: #eef1f4;
        --surface: #fbfcfd;
        --surface-strong: #ffffff;
        --foreground: #1d232c;
        --muted: #66717f;
        --line: #d7dde5;
        --blue: #245f9d;
        --green: #27745a;
        --shadow: 0 18px 46px rgba(29, 35, 44, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Arial, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        min-height: 100vh;
        padding: 28px clamp(16px, 4vw, 56px) 48px;
      }

      .app-header {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: space-between;
        max-width: 1180px;
        margin: 0 auto 18px;
      }

      .eyebrow,
      .section-kicker {
        margin: 0 0 8px;
        color: var(--blue);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0;
        font-size: clamp(2rem, 4vw, 3.8rem);
        line-height: 1.05;
      }

      .header-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .header-meta span {
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: #3d4652;
        font-weight: 800;
      }

      .dictionary-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 18px;
        max-width: 1180px;
        margin: 0 auto;
      }

      .dictionary-sidebar,
      .dictionary-main,
      .detail-card,
      .result-list,
      .search-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-strong);
        box-shadow: var(--shadow);
      }

      .dictionary-sidebar {
        display: grid;
        align-content: start;
        gap: 20px;
        padding: 18px;
      }

      .sidebar-section,
      .mode-list,
      .recent-list {
        display: grid;
        gap: 8px;
      }

      .mode-list button,
      .recent-list button {
        min-height: 44px;
        padding: 9px 11px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: #f4f7fa;
        color: #35404c;
        text-align: left;
      }

      .mode-list button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .mode-list button.active,
      .mode-list button:hover,
      .recent-list button:hover {
        border-color: #c5d1dd;
        background: #ffffff;
      }

      .mode-list button.active {
        color: var(--blue);
      }

      .mode-list span {
        color: var(--muted);
        font-weight: 800;
      }

      .dictionary-main {
        min-width: 0;
        padding: clamp(18px, 3vw, 28px);
      }

      .search-panel {
        display: grid;
        grid-template-columns: minmax(0, 0.8fr) minmax(280px, 1fr);
        gap: 20px;
        align-items: end;
        margin-bottom: 18px;
        padding: 20px;
        box-shadow: none;
      }

      .search-panel h2 {
        margin-bottom: 0;
        font-size: clamp(1.45rem, 3vw, 2.3rem);
        line-height: 1.15;
      }

      .search-field {
        display: grid;
        gap: 8px;
        color: #333b46;
        font-weight: 800;
      }

      input {
        width: 100%;
        min-height: 52px;
        padding: 0 15px;
        border: 1px solid #bbc5d0;
        border-radius: 8px;
        background: #fff;
        color: var(--foreground);
        outline: none;
      }

      input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(36, 95, 157, 0.16);
      }

      .dictionary-content {
        display: grid;
        grid-template-columns: minmax(260px, 0.8fr) minmax(320px, 1.2fr);
        gap: 18px;
        align-items: start;
      }

      .result-list {
        display: grid;
        gap: 10px;
        padding: 14px;
        box-shadow: none;
      }

      .result-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 2px 8px;
        color: var(--muted);
      }

      .result-heading strong {
        color: var(--foreground);
      }

      .word-row {
        display: grid;
        grid-template-columns: auto minmax(110px, 0.8fr) minmax(90px, 1fr);
        gap: 10px;
        align-items: center;
        min-height: 56px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--foreground);
        text-align: left;
      }

      .word-row:hover {
        border-color: #b5c4d3;
        background: #f8fafc;
      }

      .word-row small {
        color: var(--muted);
        font-weight: 700;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        min-width: 44px;
        padding: 0 10px;
        border-radius: 999px;
        color: white;
        font-size: 0.82rem;
        font-weight: 900;
      }

      .badge.noun {
        background: var(--blue);
      }

      .badge.verb {
        background: var(--green);
      }

      .detail-card {
        padding: clamp(18px, 3vw, 26px);
        box-shadow: none;
      }

      .detail-topline {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        margin-bottom: 22px;
      }

      .detail-topline h2 {
        margin-bottom: 6px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1;
      }

      .detail-topline p {
        margin-bottom: 0;
        color: var(--muted);
        font-weight: 800;
      }

      .forms-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 0 0 18px;
      }

      .forms-grid div,
      .example-block {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f7f9fb;
      }

      dt,
      .example-block span {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 900;
      }

      dd {
        margin: 5px 0 0;
        color: var(--foreground);
        font-size: 1.18rem;
        font-weight: 900;
        overflow-wrap: anywhere;
      }

      .example-block {
        margin-bottom: 14px;
      }

      .example-block p {
        margin: 8px 0 0;
        color: #29313a;
        font-size: 1.1rem;
        font-weight: 800;
        line-height: 1.45;
      }

      .note,
      .empty-state {
        color: #5a6572;
        line-height: 1.6;
      }

      .note {
        margin-bottom: 0;
      }

      .empty-state {
        padding: 18px;
      }

      @media (max-width: 940px) {
        .app-header,
        .dictionary-shell,
        .search-panel,
        .dictionary-content {
          grid-template-columns: 1fr;
        }

        .app-header {
          display: grid;
        }

        .header-meta {
          justify-content: start;
        }

      }

      @media (max-width: 620px) {
        .app-shell {
          padding: 18px 12px 32px;
        }

        .dictionary-sidebar,
        .dictionary-main {
          padding: 14px;
        }

        .word-row,
        .forms-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Offline Deutsch Trainer</p>
          <h1>오프라인 단어사전</h1>
        </div>
        <div class="header-meta" aria-label="사전 상태">
          <span id="noun-count">명사 0개</span>
          <span id="verb-count">동사 0개</span>
          <span>인터넷 불필요</span>
        </div>
      </header>

      <section class="dictionary-shell">
        <aside class="dictionary-sidebar">
          <div class="sidebar-section">
            <p class="section-kicker">품사</p>
            <div class="mode-list" id="mode-list" aria-label="품사 필터"></div>
          </div>
          <div class="sidebar-section" id="recent-section" hidden>
            <p class="section-kicker">최근 검색</p>
            <div class="recent-list" id="recent-list"></div>
          </div>
        </aside>

        <section class="dictionary-main">
          <div class="search-panel">
            <div>
              <p class="section-kicker">검색</p>
              <h2>한국어 뜻이나 독일어 단어를 입력하세요</h2>
            </div>
            <label class="search-field">
              <span>검색어</span>
              <input id="search-input" placeholder="예: 책, 가다, Schule" value="책" />
            </label>
          </div>

          <div class="dictionary-content">
            <section class="result-list" aria-label="검색 결과">
              <div class="result-heading">
                <strong>검색 결과</strong>
                <span id="result-count">0개</span>
              </div>
              <div id="result-list"></div>
            </section>

            <article class="detail-card" id="detail-card" aria-label="선택 단어 상세"></article>
          </div>
        </section>
      </section>
    </main>

    <script>
      const words = [
        { type: "명사", ko: ["책", "도서"], german: "Buch", article: "das", plural: "Bücher", example: "Ich lese ein Buch.", note: "중성 명사이며 복수에서 움라우트가 생깁니다." },
        { type: "명사", ko: ["학교"], german: "Schule", article: "die", plural: "Schulen", example: "Die Schule beginnt um acht Uhr.", note: "-e로 끝나는 여성 명사는 복수 -n이 자주 붙습니다." },
        { type: "명사", ko: ["친구", "남자 친구"], german: "Freund", article: "der", plural: "Freunde", example: "Mein Freund kommt heute.", note: "여자 친구는 die Freundin, 복수는 Freundinnen입니다." },
        { type: "명사", ko: ["시간", "시각"], german: "Zeit", article: "die", plural: "Zeiten", example: "Ich habe keine Zeit.", note: "추상명사로 관용 표현에 자주 쓰입니다." },
        { type: "명사", ko: ["집", "가정"], german: "Haus", article: "das", plural: "Häuser", example: "Das Haus ist alt.", note: "복수형에서 au가 äu로 바뀝니다." },
        { type: "명사", ko: ["사람", "인간"], german: "Mensch", article: "der", plural: "Menschen", example: "Der Mensch lernt jeden Tag.", note: "약변화 명사라 여러 격에서 -en을 확인해야 합니다." },
        { type: "명사", ko: ["도시"], german: "Stadt", article: "die", plural: "Städte", example: "Berlin ist eine große Stadt.", note: "복수형에서 a가 ä로 바뀝니다." },
        { type: "명사", ko: ["언어", "말"], german: "Sprache", article: "die", plural: "Sprachen", example: "Deutsch ist eine schöne Sprache.", note: "여성 명사이며 복수는 -n입니다." },
        { type: "명사", ko: ["문장"], german: "Satz", article: "der", plural: "Sätze", example: "Der Satz ist richtig.", note: "복수형에서 a가 ä로 바뀝니다." },
        { type: "명사", ko: ["시험"], german: "Prüfung", article: "die", plural: "Prüfungen", example: "Die Prüfung ist morgen.", note: "-ung 명사는 거의 항상 여성입니다." },
        { type: "동사", ko: ["가다"], german: "gehen", past: "ging", participle: "ist gegangen", subjunctive2: "ginge", example: "Ich gehe zur Schule.", note: "이동 동사라 완료형에서 sein을 씁니다." },
        { type: "동사", ko: ["오다"], german: "kommen", past: "kam", participle: "ist gekommen", subjunctive2: "käme", example: "Er kommt aus Korea.", note: "불규칙 동사이며 접속법 2식에 움라우트가 생깁니다." },
        { type: "동사", ko: ["보다"], german: "sehen", past: "sah", participle: "hat gesehen", subjunctive2: "sähe", example: "Wir sehen einen Film.", note: "sehen + 4격 목적어 구조를 자주 확인하세요." },
        { type: "동사", ko: ["읽다"], german: "lesen", past: "las", participle: "hat gelesen", subjunctive2: "läse", example: "Sie liest ein Buch.", note: "du liest, er/sie/es liest처럼 현재형 어간 변화가 있습니다." },
        { type: "동사", ko: ["쓰다"], german: "schreiben", past: "schrieb", participle: "hat geschrieben", subjunctive2: "schriebe", example: "Ich schreibe einen Brief.", note: "강변화 동사지만 완료형 조동사는 haben입니다." },
        { type: "동사", ko: ["먹다"], german: "essen", past: "aß", participle: "hat gegessen", subjunctive2: "äße", example: "Wir essen zusammen.", note: "du isst, er/sie/es isst 형태를 함께 익히면 좋습니다." },
        { type: "동사", ko: ["마시다"], german: "trinken", past: "trank", participle: "hat getrunken", subjunctive2: "tränke", example: "Ich trinke Wasser.", note: "불규칙 변화: i-a-u 계열입니다." },
        { type: "동사", ko: ["하다", "만들다"], german: "machen", past: "machte", participle: "hat gemacht", subjunctive2: "machte", example: "Was machst du?", note: "규칙 동사라 과거와 접속법 2식 형태가 같습니다." },
        { type: "동사", ko: ["생각하다"], german: "denken", past: "dachte", participle: "hat gedacht", subjunctive2: "dächte", example: "Ich denke an dich.", note: "혼합변화 동사입니다." },
        { type: "동사", ko: ["알다", "지식으로 알다"], german: "wissen", past: "wusste", participle: "hat gewusst", subjunctive2: "wüsste", example: "Ich weiß die Antwort.", note: "kennen은 사람/장소를 안다는 뜻에 더 가깝습니다." }
      ];

      const state = {
        mode: "전체",
        query: "책",
        recent: JSON.parse(localStorage.getItem("deutsch-dictionary-recent") || "[]")
      };

      const input = document.getElementById("search-input");
      const resultList = document.getElementById("result-list");
      const resultCount = document.getElementById("result-count");
      const detailCard = document.getElementById("detail-card");
      const modeList = document.getElementById("mode-list");
      const recentList = document.getElementById("recent-list");
      const recentSection = document.getElementById("recent-section");

      document.getElementById("noun-count").textContent = `명사 ${words.filter((word) => word.type === "명사").length}개`;
      document.getElementById("verb-count").textContent = `동사 ${words.filter((word) => word.type === "동사").length}개`;

      function normalize(value) {
        return value.trim().toLowerCase().replace(/\s+/g, " ");
      }

      function findWords() {
        const normalized = normalize(state.query);
        return words.filter((entry) => {
          const typeMatch = state.mode === "전체" || entry.type === state.mode;
          if (!normalized) return typeMatch;
          return typeMatch && (entry.ko.some((meaning) => meaning.includes(normalized)) || entry.german.toLowerCase().includes(normalized));
        });
      }

      function saveQuery(query) {
        const clean = query.trim();
        if (!clean) return;
        state.recent = [clean, ...state.recent.filter((item) => item !== clean)].slice(0, 6);
        localStorage.setItem("deutsch-dictionary-recent", JSON.stringify(state.recent));
      }

      function renderModes() {
        modeList.innerHTML = "";
        ["전체", "명사", "동사"].forEach((mode) => {
          const button = document.createElement("button");
          button.className = state.mode === mode ? "active" : "";
          button.innerHTML = `<span>${mode}</span><strong>${mode === "전체" ? words.length : words.filter((word) => word.type === mode).length}</strong>`;
          button.addEventListener("click", () => {
            state.mode = mode;
            render();
          });
          modeList.appendChild(button);
        });
      }

      function renderRecent() {
        recentSection.hidden = state.recent.length === 0;
        recentList.innerHTML = "";
        state.recent.forEach((query) => {
          const button = document.createElement("button");
          button.textContent = query;
          button.addEventListener("click", () => {
            state.query = query;
            input.value = query;
            render();
          });
          recentList.appendChild(button);
        });
      }

      function renderDetail(entry) {
        const forms = entry.type === "명사"
          ? `<dl class="forms-grid"><div><dt>성</dt><dd>${entry.article}</dd></div><div><dt>복수형</dt><dd>${entry.plural}</dd></div></dl>`
          : `<dl class="forms-grid"><div><dt>과거</dt><dd>${entry.past}</dd></div><div><dt>과거분사</dt><dd>${entry.participle}</dd></div><div><dt>접속법 2식</dt><dd>${entry.subjunctive2}</dd></div></dl>`;

        detailCard.innerHTML = `
          <div class="detail-topline">
            <span class="badge ${entry.type === "명사" ? "noun" : "verb"}">${entry.type}</span>
            <div>
              <h2>${entry.type === "명사" ? `${entry.article} ${entry.german}` : entry.german}</h2>
              <p>${entry.ko.join(", ")}</p>
            </div>
          </div>
          ${forms}
          <div class="example-block"><span>예문</span><p>${entry.example}</p></div>
          <p class="note">${entry.note}</p>
        `;
      }

      function renderResults(results) {
        resultList.innerHTML = "";
        resultCount.textContent = `${results.length}개`;

        if (results.length === 0) {
          resultList.innerHTML = `<div class="empty-state">아직 내장 사전에 없는 항목입니다. 명사는 성과 복수형, 동사는 과거-과거분사-접속법 2식을 확인해 추가하면 됩니다.</div>`;
          renderDetail(words[0]);
          return;
        }

        results.forEach((entry) => {
          const button = document.createElement("button");
          button.className = "word-row";
          button.innerHTML = `
            <span class="badge ${entry.type === "명사" ? "noun" : "verb"}">${entry.type}</span>
            <strong>${entry.type === "명사" ? `${entry.article} ${entry.german}` : entry.german}</strong>
            <small>${entry.ko.join(", ")}</small>
          `;
          button.addEventListener("click", () => {
            state.query = entry.ko[0];
            input.value = state.query;
            saveQuery(state.query);
            render();
          });
          resultList.appendChild(button);
        });

        renderDetail(results[0]);
      }

      function render() {
        renderModes();
        renderRecent();
        renderResults(findWords());
      }

      input.addEventListener("input", (event) => {
        state.query = event.target.value;
        render();
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          saveQuery(state.query);
          renderRecent();
        }
      });
      input.addEventListener("blur", () => {
        saveQuery(state.query);
        renderRecent();
      });

      render();

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => undefined);
      }
    </script>
  </body>
</html>
