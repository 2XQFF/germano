<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WORTWEG | 오프라인 독일어 학습</title>
    <meta name="description" content="인터넷 없이 독일어 단어를 학습하고 명사의 성과 복수형, 동사의 주요 변화를 확인하세요." />
    <style>
      :root { --ink:#24313a;--muted:#6b7c85;--line:#d7e2e6;--canvas:#f7fbfa;--surface:#fff;--green:#58c53f;--green-dark:#46a932;--green-pale:#e6f8df;--blue-pale:#e5f6fe;--yellow-pale:#fff4d2;--shadow:0 3px 0 #cde0d8; }
      * { box-sizing:border-box; } html { background:var(--canvas); } body { margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; } button,input { font:inherit; } button { cursor:pointer; } h1,h2,p { margin-top:0; }
      .app-shell { display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh; }.side-rail { display:flex;flex-direction:column;min-height:100vh;padding:30px 22px;border-right:1px solid var(--line);background:var(--surface); }.brand { display:inline-flex;align-items:center;gap:9px;width:fit-content;padding:0;border:0;background:transparent;color:var(--green-dark);font-size:1.2rem;font-weight:900; }.brand-mark { display:grid;width:32px;height:32px;place-items:center;border-radius:8px;background:var(--green);box-shadow:inset 0 -3px 0 rgba(33,127,51,.3);color:#fff;font-size:1rem; }.primary-nav { display:grid;gap:8px;margin-top:48px; }.primary-nav button { display:flex;align-items:center;gap:12px;min-height:48px;padding:0 13px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-weight:800;text-align:left; }.primary-nav button:hover { background:#f1f7f4;color:var(--ink); }.primary-nav button.active { border-color:#bfe5b5;background:var(--green-pale);color:var(--green-dark); }.nav-dot { width:14px;height:14px;border:3px solid currentColor;border-radius:50%; }.dictionary-dot { border-radius:3px; }.rail-status { display:grid;gap:7px;margin-top:auto;padding-top:24px;border-top:1px solid var(--line); }.rail-status p { margin-bottom:0;color:var(--green-dark);font-size:.78rem;font-weight:900;text-transform:uppercase; }.rail-status strong { font-size:.92rem; }.rail-status span { color:var(--muted);font-size:.8rem;line-height:1.5; }
      .workspace { width:min(100%,1120px);padding:24px 48px 56px;margin:0 auto; }.topbar { display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:44px; }.topbar-title,.topbar-stats { display:flex;align-items:center;gap:10px; }.topbar-title p { margin-bottom:0;color:var(--muted);font-size:.92rem;font-weight:800; }.locale-chip,.offline-dot { display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 9px;border-radius:999px;font-size:.75rem;font-weight:900; }.locale-chip { background:var(--yellow-pale);color:#a26d00; }.topbar-stats { color:var(--muted);font-size:.86rem;font-weight:800; }.offline-dot { background:var(--green-pale);color:var(--green-dark); }.learn-view,.dictionary-view { margin-top:54px; }.learn-heading,.dictionary-heading { display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:26px; }.eyebrow { margin-bottom:8px;color:var(--green-dark);font-size:.78rem;font-weight:900;text-transform:uppercase; } h1 { margin-bottom:0;font-size:2rem;line-height:1.16; }.goal-progress { width:min(100%,260px); }.progress-label { display:flex;justify-content:space-between;margin-bottom:9px;color:var(--muted);font-size:.8rem;font-weight:800; }.progress-label strong { color:var(--green-dark); }.progress-track { height:12px;overflow:hidden;border-radius:999px;background:#dfecea; }.progress-track span { display:block;height:100%;border-radius:inherit;background:var(--green);transition:width .18s ease; }
      .challenge-card { position:relative;min-height:500px;overflow:hidden;padding:44px 48px 36px;border:2px solid #cee2d7;border-radius:8px;background:var(--surface);box-shadow:var(--shadow); }.challenge-copy { position:relative;z-index:1;max-width:540px; }.prompt-label { margin-bottom:12px;color:var(--muted);font-size:.92rem;font-weight:800; }.challenge-copy h2 { margin-bottom:4px;font-size:3rem;line-height:1.05; }.alternate-meaning { margin-bottom:0;color:var(--muted);font-weight:700; }.guide-image { position:absolute;top:26px;right:34px;width:min(36%,300px);max-height:285px;object-fit:contain;object-position:center; }.primary-button,.secondary-button { min-height:48px;padding:0 22px;border-radius:8px;font-weight:900; }.primary-button { border:1px solid var(--green-dark);border-bottom-width:4px;background:var(--green);color:#fff; }.primary-button:hover { background:#63cf49; }.primary-button:active,.secondary-button:active { transform:translateY(2px);border-bottom-width:2px; }.secondary-button { border:1px solid #b6d5e4;border-bottom-width:4px;background:var(--blue-pale);color:#277aa6; }.reveal-button { position:absolute;bottom:36px;left:48px; }.answer-area { position:relative;z-index:1;max-width:620px;margin-top:42px; }.answer-word { display:flex;align-items:center;gap:12px;margin-bottom:20px; }.answer-word strong { font-size:2.15rem;line-height:1; }.type-chip { display:inline-flex;align-items:center;justify-content:center;min-width:45px;min-height:25px;padding:0 8px;border-radius:999px;font-size:.72rem;font-weight:900; }.type-chip.noun { background:var(--blue-pale);color:#1977a9; }.type-chip.verb { background:var(--yellow-pale);color:#956900; }.forms-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line); }.forms-grid.noun-forms { grid-template-columns:repeat(2,minmax(0,1fr)); }.forms-grid div { min-width:0;padding:15px 14px 15px 0; }.forms-grid div+div { padding-left:14px;border-left:1px solid var(--line); } dt { color:var(--muted);font-size:.76rem;font-weight:900; } dd { margin:7px 0 0;font-size:1rem;font-weight:900;overflow-wrap:anywhere; }.word-note { margin:17px 0 0;color:var(--muted);font-size:.9rem;line-height:1.55; }.answer-actions { display:flex;justify-content:flex-end;gap:10px;margin-top:24px; }.learn-footer { display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:0;margin-top:32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line); }.learn-footer div { display:grid;gap:5px;padding:17px 0; }.learn-footer div+div { padding-left:20px;border-left:1px solid var(--line); }.learn-footer span { color:var(--muted);font-size:.75rem;font-weight:900; }.learn-footer strong { font-size:.95rem; }
      .dictionary-heading>span { color:var(--muted);font-size:.88rem;font-weight:800; }.dictionary-search { display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:20px; } input { width:100%;min-height:50px;padding:0 15px;border:2px solid #cbdcdf;border-radius:8px;background:var(--surface);color:var(--ink);font-weight:700;outline:0; } input:focus { border-color:var(--green);box-shadow:0 0 0 3px var(--green-pale); }.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }.filter-row,.recent-row { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }.filter-row { margin-bottom:14px; }.filter-row button,.recent-row button { min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:.83rem;font-weight:800; }.filter-row button:hover,.recent-row button:hover { border-color:#a5d69a;color:var(--green-dark); }.filter-row button.active { border-color:var(--green);background:var(--green-pale);color:var(--green-dark); }.filter-row button span { margin-left:4px; }.recent-row { margin:0 0 26px; }.recent-row>span { margin-right:4px;color:var(--muted);font-size:.8rem;font-weight:900; }.dictionary-grid { display:grid;grid-template-columns:minmax(280px,.88fr) minmax(320px,1.12fr);gap:34px;align-items:start; }.result-list { display:grid;gap:9px; }.result-heading { display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;color:var(--muted);font-size:.88rem; }.result-heading strong { color:var(--ink); }.word-row { display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-align:left; }.word-row:hover { border-color:#a5d69a;background:#fbfffa; }.word-row.selected { border-color:var(--green);box-shadow:inset 4px 0 0 var(--green); }.word-row>span:last-child { display:grid;gap:4px;min-width:0; }.word-row strong { overflow-wrap:anywhere; }.word-row small { color:var(--muted);font-size:.78rem;font-weight:700;overflow-wrap:anywhere; }.word-detail { padding:30px;border:2px solid #cee2d7;border-radius:8px;background:var(--surface);box-shadow:var(--shadow); }.word-detail h2 { margin:18px 0 6px;font-size:2.3rem;line-height:1;overflow-wrap:anywhere; }.meaning { margin-bottom:26px;color:var(--muted);font-weight:800; }.empty-state { margin:0;padding:24px 0;color:var(--muted);line-height:1.6; }
      @media (max-width:860px) { .app-shell { grid-template-columns:1fr; }.side-rail { min-height:auto;padding:16px 18px;border-right:0;border-bottom:1px solid var(--line); }.primary-nav { display:flex;margin-top:17px; }.primary-nav button { min-height:40px; }.rail-status { display:none; }.workspace { padding:24px 22px 42px; }.learn-view,.dictionary-view { margin-top:36px; } }
      @media (max-width:640px) { .topbar { align-items:flex-start; }.topbar-stats { justify-content:flex-end;flex-wrap:wrap; }.learn-heading,.dictionary-heading { display:grid;align-items:start;gap:18px; } h1 { font-size:1.65rem; }.goal-progress { width:100%; }.challenge-card { min-height:510px;padding:30px 22px 28px; }.challenge-copy h2 { font-size:2.4rem; }.guide-image { top:22px;right:10px;width:42%;max-height:175px;opacity:.28; }.reveal-button { right:22px;bottom:28px;left:22px;width:calc(100% - 44px); }.answer-area { margin-top:36px; }.answer-word strong { font-size:1.8rem; }.forms-grid,.forms-grid.noun-forms { grid-template-columns:1fr; }.forms-grid div,.forms-grid div+div { padding:12px 0;border-left:0; }.forms-grid div+div { border-top:1px solid var(--line); }.answer-actions { display:grid;grid-template-columns:1fr 1fr; }.answer-actions button { padding:0 10px; }.learn-footer { grid-template-columns:1fr; }.learn-footer div+div { padding-left:0;border-top:1px solid var(--line);border-left:0; }.dictionary-search,.dictionary-grid { grid-template-columns:1fr; }.dictionary-search .primary-button { width:100%; }.word-detail { padding:23px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const DAILY_GOAL = 8;
      const app = document.getElementById("app");
      const readList = (key) => { try { const value = JSON.parse(localStorage.getItem(key) || "[]"); return Array.isArray(value) ? value : []; } catch { return []; } };
      let WORDS = [];
      let nounCount = 0;
      let verbCount = 0;
      const state = { view: "learn", studyIndex: 0, revealed: false, learned: readList("deutsch-learned-today"), mode: "전체", query: "", recent: readList("deutsch-dictionary-recent"), selectedGerman: "" };
      const normalize = (value) => value.trim().toLowerCase().replace(/\s+/g, " ");
      const escapeHtml = (value) => String(value).replace(/[&<>"]/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[char]);
      const title = (entry) => entry.type === "명사" ? `${entry.article} ${entry.german}` : entry.german;
      const typeChip = (entry) => `<span class="type-chip ${entry.type === "명사" ? "noun" : "verb"}">${entry.type}</span>`;
      const wordForms = (entry) => entry.type === "명사"
        ? `<dl class="forms-grid noun-forms"><div><dt>성</dt><dd>${entry.article}</dd></div><div><dt>복수형</dt><dd>${entry.plural}</dd></div></dl>`
        : `<dl class="forms-grid"><div><dt>과거</dt><dd>${entry.past}</dd></div><div><dt>과거분사</dt><dd>${entry.participle}</dd></div><div><dt>접속법 2식</dt><dd>${entry.subjunctive2}</dd></div></dl>`;
      const findWords = () => { const query = normalize(state.query); return WORDS.filter((entry) => (state.mode === "전체" || state.mode === entry.type) && (!query || entry.ko.some((meaning) => meaning.includes(query)) || entry.german.toLowerCase().includes(query))); };
      const nav = () => `<aside class="side-rail"><button class="brand" data-view="learn" type="button" aria-label="학습 홈으로 이동"><span class="brand-mark" aria-hidden="true">W</span><span>WORTWEG</span></button><nav class="primary-nav" aria-label="주요 메뉴"><button class="${state.view === "learn" ? "active" : ""}" data-view="learn" type="button"><span class="nav-dot" aria-hidden="true"></span>학습</button><button class="${state.view === "dictionary" ? "active" : ""}" data-view="dictionary" type="button"><span class="nav-dot dictionary-dot" aria-hidden="true"></span>단어사전</button></nav><div class="rail-status"><p>오프라인 모드</p><strong>내장 단어 ${WORDS.length}개</strong><span>인터넷 연결 없이 학습할 수 있어요.</span></div></aside>`;
      const topbar = () => `<header class="topbar"><div class="topbar-title"><span class="locale-chip">DE</span><p>독일어 단어 훈련</p></div><div class="topbar-stats"><span>오늘 ${Math.min(state.learned.length, DAILY_GOAL)}/${DAILY_GOAL}</span><span class="offline-dot">오프라인</span></div></header>`;
      function learnView() {
        const word = WORDS[state.studyIndex % WORDS.length];
        const progress = Math.min(state.learned.length, DAILY_GOAL) / DAILY_GOAL * 100;
        const answer = state.revealed
          ? `<div class="answer-area"><div class="answer-word">${typeChip(word)}<strong>${title(word)}</strong></div>${wordForms(word)}<p class="word-note">${word.note}</p><div class="answer-actions"><button class="secondary-button" id="repeat" type="button">다시 보기</button><button class="primary-button" id="know" type="button">알겠어요</button></div></div>`
          : `<button class="primary-button reveal-button" id="reveal" type="button">정답 보기</button>`;
        return `<section class="learn-view" aria-label="단어 학습"><div class="learn-heading"><div><p class="eyebrow">오늘의 단어</p><h1>한 단어씩, 확실하게.</h1></div><div class="goal-progress" aria-label="오늘의 목표"><div class="progress-label"><span>오늘의 목표</span><strong>${Math.min(state.learned.length, DAILY_GOAL)}/${DAILY_GOAL}</strong></div><div class="progress-track"><span style="width:${progress}%"></span></div></div></div><section class="challenge-card"><div class="challenge-copy"><p class="prompt-label">이 뜻을 독일어로 말해보세요</p><h2>${word.ko[0]}</h2>${word.ko.length > 1 ? `<p class="alternate-meaning">${word.ko.slice(1).join(", ")}</p>` : ""}</div><img class="guide-image" src="./blue-dragon-guide.png" alt="단어 학습을 돕는 파란 용" />${answer}</section><section class="learn-footer" aria-label="학습 정보"><div><span>다음</span><strong>${WORDS[(state.studyIndex + 1) % WORDS.length].ko[0]}</strong></div><div><span>명사</span><strong>${nounCount}개</strong></div><div><span>동사</span><strong>${verbCount}개</strong></div></section></section>`;
      }
      function dictionaryView() {
        const results = findWords();
        const selected = results.find((entry) => entry.german === state.selectedGerman) || results[0] || WORDS[0];
        const rows = results.length ? results.map((entry) => `<button class="word-row ${selected.german === entry.german ? "selected" : ""}" data-word="${entry.german}" type="button">${typeChip(entry)}<span><strong>${title(entry)}</strong><small>${entry.ko.join(", ")}</small></span></button>`).join("") : `<p class="empty-state">아직 이 단어는 내장 사전에 없습니다.</p>`;
        return `<section class="dictionary-view" aria-label="독일어 단어사전"><div class="dictionary-heading"><div><p class="eyebrow">내장 사전</p><h1>단어를 찾아보세요</h1></div><span>${WORDS.length}개 단어</span></div><form class="dictionary-search" id="search-form"><label><span class="sr-only">검색어</span><input id="search-input" placeholder="한국어 뜻 또는 독일어 단어" /></label><button class="primary-button" type="submit">검색</button></form><div class="filter-row" aria-label="품사 필터"><button class="${state.mode === "전체" ? "active" : ""}" data-mode="전체" type="button">전체 <span>${WORDS.length}</span></button><button class="${state.mode === "명사" ? "active" : ""}" data-mode="명사" type="button">명사 <span>${nounCount}</span></button><button class="${state.mode === "동사" ? "active" : ""}" data-mode="동사" type="button">동사 <span>${verbCount}</span></button></div><div class="recent-row" id="recent-row" ${state.recent.length ? "" : "hidden"}><span>최근 검색</span></div><div class="dictionary-grid"><section class="result-list" aria-label="검색 결과"><div class="result-heading"><strong>검색 결과</strong><span>${results.length}개</span></div>${rows}</section><article class="word-detail" aria-label="선택한 단어의 형태">${typeChip(selected)}<h2>${title(selected)}</h2><p class="meaning">${selected.ko.join(", ")}</p>${wordForms(selected)}<p class="word-note">${selected.note}</p></article></div></section>`;
      }
      function saveQuery() { const clean = state.query.trim(); if (!clean) return; state.recent = [clean, ...state.recent.filter((item) => item !== clean)].slice(0, 6); localStorage.setItem("deutsch-dictionary-recent", JSON.stringify(state.recent)); }
      function moveNext(markKnown) { const word = WORDS[state.studyIndex % WORDS.length]; if (markKnown && !state.learned.includes(word.german)) { state.learned.push(word.german); localStorage.setItem("deutsch-learned-today", JSON.stringify(state.learned)); } state.studyIndex += 1; state.revealed = false; render(); }
      function render() {
        app.innerHTML = `<main class="app-shell">${nav()}<section class="workspace">${topbar()}${state.view === "learn" ? learnView() : dictionaryView()}</section></main>`;
        app.querySelectorAll("[data-view]").forEach((button) => button.addEventListener("click", () => { state.view = button.dataset.view; render(); }));
        if (state.view === "learn") { const reveal = document.getElementById("reveal"); const repeat = document.getElementById("repeat"); const know = document.getElementById("know"); if (reveal) reveal.addEventListener("click", () => { state.revealed = true; render(); }); if (repeat) repeat.addEventListener("click", () => moveNext(false)); if (know) know.addEventListener("click", () => moveNext(true)); return; }
        const input = document.getElementById("search-input"); input.value = state.query; input.addEventListener("input", (event) => { state.query = event.target.value; render(); }); document.getElementById("search-form").addEventListener("submit", (event) => { event.preventDefault(); saveQuery(); render(); });
        app.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => { state.mode = button.dataset.mode; render(); })); app.querySelectorAll("[data-word]").forEach((button) => button.addEventListener("click", () => { state.selectedGerman = button.dataset.word; render(); }));
        const recentRow = document.getElementById("recent-row"); state.recent.forEach((query) => { const button = document.createElement("button"); button.type = "button"; button.textContent = query; button.addEventListener("click", () => { state.query = query; render(); }); recentRow.appendChild(button); });
      }
      fetch("./dictionary-data.json")
        .then((response) => {
          if (!response.ok) throw new Error("단어 데이터를 불러오지 못했습니다.");
          return response.json();
        })
        .then((data) => {
          WORDS = data;
          nounCount = WORDS.filter((word) => word.type === "명사").length;
          verbCount = WORDS.filter((word) => word.type === "동사").length;
          state.selectedGerman = WORDS[0].german;
          render();
        })
        .catch(() => { app.textContent = "단어 데이터를 불러오지 못했습니다."; });
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => undefined);
    </script>
  </body>
</html>
